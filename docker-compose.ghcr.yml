# GHCR‑Referenz‑Compose für hAI.MyLLMChat
# Verwende dies als Vorlage, wenn du explizit mit GHCR‑Images arbeiten willst.
# In der Praxis reicht meist das normale docker-compose.yml, das bereits auf GHCR zeigt.

services:
  hai-myllmchat:
    image: ghcr.io/jbkunama1/hai-myllmchat:latest
    container_name: hai-myllmchat
    ports:
      - "8066:8066"
    volumes:
      - hai-data:/data
    environment:
      - HAI_ADMIN_USER=${HAI_ADMIN_USER:-admin}
      - HAI_ADMIN_PASSWORD=${HAI_ADMIN_PASSWORD:-changeme}
      - HAI_ADMIN_TOKEN=${HAI_ADMIN_TOKEN:-}
      - HAI_CHAT_API_KEY=${HAI_CHAT_API_KEY:-}
      - HAI_IMAGE_API_KEY=${HAI_IMAGE_API_KEY:-}
      - HAI_MCP_API_KEY=${HAI_MCP_API_KEY:-}
      - TZ=Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8066/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  hai-data:
    name: hai-data
