services:
  hai-myllmchat:
    image: ghcr.io/jbkunama1/hai-myllmchat:latest
    container_name: hai-myllmchat
    ports:
      - "8066:8080"
    volumes:
      - hai-data:/data
    environment:
      - HAI_ADMIN_USER=${HAI_ADMIN_USER:-admin}
      - HAI_ADMIN_PASSWORD=${HAI_ADMIN_PASSWORD:-changeme}
      - HAI_ADMIN_TOKEN=${HAI_ADMIN_TOKEN:-}
      - HAI_CHAT_API_KEY=${HAI_CHAT_API_KEY:-}
      - HAI_IMAGE_API_KEY=${HAI_IMAGE_API_KEY:-}
      - HAI_MCP_API_KEY=${HAI_MCP_API_KEY:-}
      - TZ=Europe/Berlin
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8066 && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - highfishNetwork

volumes:
  hai-data:
    name: hai-data

networks:
  highfishNetwork:
    name: highfishNetwork
    external: true
