name: Manual Docker Build → GHCR

on:
  workflow_dispatch:
    inputs:
      build_context:
        description: 'Docker build context (default: .)'
        required: false
        default: '.'
      dockerfile_path:
        description: 'Dockerfile Pfad (default: Dockerfile)'
        required: false
        default: 'Dockerfile'
      image_tag:
        description: 'Image Tag (z.B. latest oder v1.2.3)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jbkunama1/hai-myllmchat

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ github.event.inputs.build_context }}
          file: ${{ github.event.inputs.dockerfile_path }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
